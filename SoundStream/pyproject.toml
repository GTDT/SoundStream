[build-system]
requires = ['setuptools>=61.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'soundstream'
version = '2.0.0'
description = 'P2P audio streaming library with CLI'
requires-python = '>=3.9'
dependencies = [
    'aiortc',
    'sounddevice',
    'aiohttp',
    'numpy',
    'prompt_toolkit',
]

[project.scripts]
soundstream = 'soundstream.__main__:main'

[tool.setuptools.packages.find]
where = ['src']
